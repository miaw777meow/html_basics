<!--When to Use Absolute Paths, Absolute URLs, and Relative Paths

So, which should you use and when: an absolute path, an absolute URL, or a relative path? Here are the rules you
 should follow:

    Use absolute paths when you want to reference a resource from a fixed location, such as from the 
    root of your site or a known directory on your local machine.

    Use an absolute URL when linking to a resource hosted on an external website.

    Use relative paths when linking to resources within the same website.

    Use relative paths if you want to keep your code cleaner and easier to maintain during development.

    Use relative paths during local testing to ensure links work without an internet connection.

    For example, given this file tree:

my-app/
├─ public/
│  ├─ favicon.ico
│  ├─ index.html
├─ src/
│  ├─ index.css
│  ├─ index.js

If your public/index.html file needed to load the favicon.ico file, you would use a relative path 
with a single dot to access the current directory: ./favicon.ico. If your public/index.html file 
needed to load the index.css file, you would use a relative path with double dots to navigate to 
the parent my-app  directory first, then to the src directory, and finally to your file: ../src/index.css
-->
